# Alembic configuration for reinsai backend.
#
# Migrations live under ``alembic/versions/`` and are managed with the
# standard alembic CLI (``alembic upgrade head``, ``alembic downgrade
# -1``, etc.). The database URL is read from the ``DATABASE_URL`` env
# var by ``env.py`` rather than hard-coded here, so the same config
# works against the local SSH-tunnelled Postgres and any test
# instance without editing this file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
