# /etc/nginx/conf.d/insightre.conf
# Reverse proxy for https://insightre.ai -> reinsai frontend (5300) + backend (5301)
# certbot --nginx will add TLS blocks automatically.

server {
    listen 80;
    listen [::]:80;
    server_name insightre.ai www.insightre.ai;

    client_max_body_size 50M;

    # Sample/reference files served by backend StaticFiles mount
    location /files/ {
        proxy_pass http://127.0.0.1:5301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Backend API — preserve /api/ prefix (FastAPI routes are defined with /api/...)
    location /api/ {
        proxy_pass http://127.0.0.1:5301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Server-sent events / streaming support (used by SOC streaming)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
